<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Showcase - Consulta de Perfil</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --steam-bg-dark: #101216;
      --steam-bg-card: #171a21;
      --steam-bg-hover: #21252e;
      --steam-blue: #1b2838;
      --steam-accent: #66c0f4;
      --steam-gold: #e5c158;
      --steam-rare-purple: #a34cdd;
      --steam-border: #2a475e;
      --steam-text: #c7d5e0;
      --steam-text-muted: #8f98a0;
      --steam-success-bright: #a4d007;
      --steam-error: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Motiva Sans', Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1b2838 0%, var(--steam-bg-dark) 80%);
      color: var(--steam-text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header.game-header {
      background: linear-gradient(90deg, rgba(23, 26, 33, 0.95) 0%, rgba(27, 40, 56, 0.8) 100%);
      border: 1px solid var(--steam-border);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .game-info h1 { font-size: 1.8rem; color: #ffffff; margin-bottom: 6px; }
    .game-info p { color: var(--steam-text-muted); font-size: 0.9rem; }

    .profile-search-card {
      background: var(--steam-bg-card);
      border: 1px solid var(--steam-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .profile-search-title {
      font-size: 1rem;
      color: var(--steam-accent);
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-form-single {
      display: flex;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--steam-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      background: #0d1217;
      border: 1px solid var(--steam-border);
      color: #fff;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus { border-color: var(--steam-accent); }

    .btn-steam {
      background: linear-gradient(90deg, #a4d007 0%, #537000 100%);
      color: #fff;
      border: none;
      padding: 0 24px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      align-self: flex-end;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: filter 0.2s;
    }

    .btn-steam:hover { filter: brightness(1.2); }

    .status-banner {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      display: none;
    }

    .status-banner.error { background: rgba(231, 76, 60, 0.2); border: 1px solid var(--steam-error); color: var(--steam-error); }
    .status-banner.info { background: rgba(102, 192, 244, 0.2); border: 1px solid var(--steam-accent); color: var(--steam-accent); }

    .stats-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--steam-bg-card);
      border: 1px solid rgba(42, 71, 94, 0.5);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
    }

    .stat-value { font-size: 1.6rem; font-weight: bold; color: var(--steam-accent); margin-top: 4px; }
    .stat-card.rare .stat-value { color: var(--steam-rare-purple); }

    .controls-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;
      background: var(--steam-bg-card); padding: 12px 18px; border-radius: 6px; border: 1px solid var(--steam-border);
    }

    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-filter {
      background: #212b38; color: var(--steam-text-muted); border: 1px solid transparent; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
    }

    .btn-filter.active { background: var(--steam-accent); color: #000; }

    .search-box {
      display: flex; align-items: center; background: #0d1217; border: 1px solid var(--steam-border); border-radius: 4px; padding: 4px 10px; width: 260px;
    }

    .search-box input { background: transparent; border: none; color: #fff; padding: 6px; font-size: 0.85rem; width: 100%; outline: none; }

    .achievements-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px;
    }

    .achievement-card {
      background: var(--steam-bg-card); border: 1px solid var(--steam-border); border-radius: 6px; padding: 14px; display: flex; gap: 14px; align-items: center; position: relative;
    }

    .achievement-card.locked { opacity: 0.45; filter: grayscale(100%); }

    .rarity-rank-tag {
      position: absolute; top: 8px; right: 10px; font-size: 0.7rem; font-weight: bold; background: rgba(102, 192, 244, 0.15); color: var(--steam-accent); padding: 2px 7px; border-radius: 3px; border: 1px solid var(--steam-accent);
    }

    .game-name-tag {
      font-size: 0.68rem; color: var(--steam-gold); font-weight: bold; text-transform: uppercase; margin-bottom: 2px;
    }

    .achievement-card.rare-achievement { border-color: var(--steam-rare-purple); }
    .achievement-card.rare-achievement .rarity-rank-tag { color: var(--steam-rare-purple); background: rgba(163, 76, 221, 0.15); border-color: var(--steam-rare-purple); }

    .achievement-icon {
      width: 64px; height: 64px; min-width: 64px; border-radius: 4px; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.1); background-color: #0d1217;
    }

    .achievement-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; padding-right: 50px; }
    .achievement-name { font-size: 0.95rem; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .achievement-desc { font-size: 0.78rem; color: var(--steam-text-muted); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .achievement-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.72rem; }
    .unlock-date { color: var(--steam-success-bright); }
    .global-percentage { color: var(--steam-accent); font-weight: bold; }

    @media (max-width: 768px) {
      .profile-form-single { flex-direction: column; }
      .btn-steam { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="game-header">
      <div class="game-info">
        <h1>Muro Global de Logros de Steam</h1>
        <p>Analizador de perfiles: Muestra todos los logros ordenados del <b style="color:var(--steam-accent);">más raro al menos raro</b>.</p>
      </div>
    </header>

    <!-- Caja de Consulta Única -->
    <div class="profile-search-card">
      <div class="profile-search-title">
        <i class="fab fa-steam"></i> Ingresar Datos Manualmente
      </div>
      <div class="profile-form-single">
        <div class="input-group">
          <label for="steam-url-input">URL DE PERFIL / STEAMID64</label>
          <input type="text" id="steam-url-input" placeholder="https://steamcommunity.com/profiles/76561198000000000 o https://steamcommunity.com/id/tu_usuario/">
        </div>
        <button class="btn-steam" onclick="fetchAchievementsFromProfile()">
          <i class="fas fa-search"></i> Buscar
        </button>
      </div>
    </div>

    <div id="status-banner" class="status-banner"></div>

    <div class="stats-panel">
      <div class="stat-card">
        <div>Logros Totales</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div>Desbloqueados</div>
        <div class="stat-value" style="color: var(--steam-success-bright);" id="stat-unlocked">0</div>
      </div>
      <div class="stat-card rare">
        <div>Raros (&lt;10%)</div>
        <div class="stat-value" id="stat-rare">0</div>
      </div>
      <div class="stat-card">
        <div>Juegos Escaneados</div>
        <div class="stat-value" id="stat-games">0</div>
      </div>
    </div>

    <div class="controls-bar">
      <div class="filter-buttons">
        <button class="btn-filter active" onclick="filterAchievements('all', this)">Todos (Por Rareza)</button>
        <button class="btn-filter" onclick="filterAchievements('unlocked', this)">Desbloqueados</button>
        <button class="btn-filter" onclick="filterAchievements('locked', this)">Bloqueados</button>
        <button class="btn-filter" onclick="filterAchievements('rare', this)">Raros (&lt;10%)</button>
      </div>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Buscar por logro o juego..." oninput="handleSearch()">
      </div>
    </div>

    <div class="achievements-grid" id="achievements-grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--steam-text-muted); padding: 40px;">
        Pega tu enlace de Steam en la casilla de arriba y presiona "Buscar".
      </div>
    </div>

  </div>

  <script>
    // 🔑 CONFIGURACIÓN: Ingresa tu Steam Web API Key aquí para que el sitio funcione globalmente
    const STEAM_API_KEY = "1B6251745150EA2C175C58EADEC4DD23"; 
    const CORS_PROXY = "https://corsproxy.io/?";

    function handleImageError(img) {
      img.onerror = null;
      img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23171a21' rx='4'/><path d='M32 14a18 18 0 1 0 18 18A18 18 0 0 0 32 14zm0 30a12 12 0 1 1 12-12 12 12 0 0 1-12 12z' fill='%2366c0f4'/><polygon points='32,22 35,28 42,29 37,34 38,41 32,37 26,41 27,34 22,29 29,28' fill='%23e5c158'/></svg>";
    }

    let allMasterAchievements = [];
    let activeFilter = 'all';

    function showStatus(msg, isError = false) {
      const banner = document.getElementById('status-banner');
      banner.style.display = 'block';
      banner.className = `status-banner ${isError ? 'error' : 'info'}`;
      banner.textContent = msg;
    }

    function hideStatus() {
      document.getElementById('status-banner').style.display = 'none';
    }

    async function resolveSteamId(userInput) {
      if (!userInput) return null;
      const clean = userInput.trim().replace(/\/$/, "");

      if (/^\d{17}$/.test(clean)) return clean;

      const profileMatch = clean.match(/\/profiles\/(\d{17})/);
      if (profileMatch) return profileMatch[1];

      const vanityMatch = clean.match(/\/id\/([^\/]+)/);
      const vanityName = vanityMatch ? vanityMatch[1] : clean;

      if (STEAM_API_KEY && STEAM_API_KEY !== "1B6251745150EA2C175C58EADEC4DD23") {
        try {
          const res = await fetch(`${CORS_PROXY}${encodeURIComponent(`https://api.steampowered.com/ISteamUser/ResolveVanityURL/v0001/?key=${STEAM_API_KEY}&vanityurl=${vanityName}`)}`);
          const data = await res.json();
          if (data.response && data.response.success === 1) {
            return data.response.steamid;
          }
        } catch (e) {
          console.warn("No se pudo resolver la Vanity URL:", e);
        }
      }

      return vanityName;
    }

    async function fetchAchievementsFromProfile() {
      const rawUser = document.getElementById('steam-url-input').value;

      if (!rawUser) {
        showStatus('Ingresa una URL o SteamID64 válido.', true);
        return;
      }

      if (!STEAM_API_KEY || STEAM_API_KEY === "1B6251745150EA2C175C58EADEC4DD23") {
        showStatus('Debes colocar tu Steam API Key dentro de la variable "STEAM_API_KEY" en el código JavaScript del archivo.', true);
        return;
      }

      showStatus('Buscando perfil y lista de juegos en Steam...');

      try {
        const steamId = await resolveSteamId(rawUser);

        // 1. Obtener juegos del usuario
        const gamesUrl = `${CORS_PROXY}${encodeURIComponent(`https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${STEAM_API_KEY}&steamid=${steamId}&format=json&include_appinfo=true`)}`;
        const gamesRes = await fetch(gamesUrl);
        if (!gamesRes.ok) throw new Error('Error al conectar con Steam. Revisa el perfil o la API Key.');

        const gamesData = await gamesRes.json();
        const ownedGames = gamesData.response?.games || [];
        const playedGames = ownedGames.filter(g => g.playtime_forever > 0);

        if (playedGames.length === 0) {
          throw new Error('No se encontraron juegos jugados en la cuenta o los "Detalles de los juegos" en la privacidad del perfil no están configurados como PÚBLICOS.');
        }

        allMasterAchievements = [];
        let processedGamesCount = 0;

        // 2. Recorrer juegos e ir extrayendo logros
        for (let i = 0; i < playedGames.length; i++) {
          const game = playedGames[i];
          showStatus(`Escaneando logros (${i + 1}/${playedGames.length}): ${game.name}...`);

          try {
            const playerAchsUrl = `${CORS_PROXY}${encodeURIComponent(`https://api.steampowered.com/ISteamUserStats/GetPlayerAchievements/v0001/?appid=${game.appid}&key=${STEAM_API_KEY}&steamid=${steamId}&l=spanish`)}`;
            const pRes = await fetch(playerAchsUrl);
            if (!pRes.ok) continue;

            const pData = await pRes.json();
            const playerAchs = pData.playerstats?.achievements;
            if (!playerAchs || playerAchs.length === 0) continue;

            const rarityUrl = `${CORS_PROXY}${encodeURIComponent(`https://api.steampowered.com/ISteamUserStats/GetGlobalAchievementPercentagesForApp/v0002/?gameid=${game.appid}`)}`;
            const rRes = await fetch(rarityUrl);
            const rData = rRes.ok ? await rRes.json() : {};
            const globalPercentages = {};
            (rData.achievementpercentages?.achievements || []).forEach(item => {
              globalPercentages[item.name] = parseFloat(item.percent).toFixed(1);
            });

            const schemaUrl = `${CORS_PROXY}${encodeURIComponent(`https://api.steampowered.com/ISteamUserStats/GetSchemaForGame/v2/?key=${STEAM_API_KEY}&appid=${game.appid}&l=spanish`)}`;
            const sRes = await fetch(schemaUrl);
            const sData = sRes.ok ? await sRes.json() : {};
            const schemaMap = {};
            (sData.game?.availableGameStats?.achievements || []).forEach(a => {
              schemaMap[a.name] = a;
            });

            playerAchs.forEach(pAch => {
              const details = schemaMap[pAch.apiname] || {};
              const pct = globalPercentages[pAch.apiname] !== undefined ? parseFloat(globalPercentages[pAch.apiname]) : 100.0;
              const unlockDate = pAch.unlocktime > 0 ? new Date(pAch.unlocktime * 1000).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : null;

              allMasterAchievements.push({
                id: `${game.appid}_${pAch.apiname}`,
                gameName: game.name,
                name: details.displayName || pAch.apiname,
                description: details.description || 'Sin descripción.',
                iconUnlocked: details.icon || '',
                iconLocked: details.icongray || details.icon || '',
                unlocked: pAch.achieved === 1,
                unlockTime: unlockDate,
                globalPercent: pct
              });
            });

            processedGamesCount++;
          } catch (e) {
            // Ignorar errores individuales por juego sin soporte de logros
          }
        }

        // 3. Ordenar del más raro (menor %) al menos raro
        allMasterAchievements.sort((a, b) => a.globalPercent - b.globalPercent);

        document.getElementById('stat-games').textContent = processedGamesCount;
        hideStatus();
        applyFiltersAndSearch();

      } catch (err) {
        showStatus(`Error: ${err.message}`, true);
      }
    }

    function renderAchievements(data) {
      const grid = document.getElementById('achievements-grid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--steam-text-muted); padding: 40px;">No se encontraron logros.</div>';
        return;
      }

      data.forEach((ach, index) => {
        const isRare = ach.globalPercent < 10.0;
        const statusClass = ach.unlocked ? 'unlocked' : 'locked';
        const rareClass = isRare ? 'rare-achievement' : '';
        const iconSrc = ach.unlocked ? ach.iconUnlocked : ach.iconLocked;

        const card = document.createElement('div');
        card.className = `achievement-card ${statusClass} ${rareClass}`;

        card.innerHTML = `
          <div class="rarity-rank-tag">#${index + 1} Más Raro</div>
          <img src="${iconSrc}" alt="${ach.name}" class="achievement-icon" onerror="handleImageError(this)">
          <div class="achievement-info">
            <div class="game-name-tag">${ach.gameName}</div>
            <div class="achievement-name" title="${ach.name}">${ach.name}</div>
            <div class="achievement-desc">${ach.description}</div>
            <div class="achievement-meta">
              <span class="unlock-date">${ach.unlocked ? `<i class="fas fa-check-circle"></i> ${ach.unlockTime}` : 'Bloqueado'}</span>
              <span class="global-percentage">${ach.globalPercent}% global</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      const total = allMasterAchievements.length;
      const unlocked = allMasterAchievements.filter(a => a.unlocked).length;
      const rare = allMasterAchievements.filter(a => a.globalPercent < 10.0 && a.unlocked).length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-unlocked').textContent = unlocked;
      document.getElementById('stat-rare').textContent = rare;
    }

    function filterAchievements(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      applyFiltersAndSearch();
    }

    function handleSearch() { applyFiltersAndSearch(); }

    function applyFiltersAndSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allMasterAchievements.filter(ach => {
        const matchesFilter = 
          activeFilter === 'all' ||
          (activeFilter === 'unlocked' && ach.unlocked) ||
          (activeFilter === 'locked' && !ach.unlocked) ||
          (activeFilter === 'rare' && ach.globalPercent < 10.0);

        const matchesQuery = 
          ach.name.toLowerCase().includes(query) || 
          ach.description.toLowerCase().includes(query) ||
          ach.gameName.toLowerCase().includes(query);

        return matchesFilter && matchesQuery;
      });

      renderAchievements(filtered);
    }
  </script>
</body>
</html>
