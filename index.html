<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Showcase - Muro Global de Logros</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --steam-bg-dark: #101216;
      --steam-bg-card: #171a21;
      --steam-bg-hover: #21252e;
      --steam-blue: #1b2838;
      --steam-accent: #66c0f4;
      --steam-gold: #e5c158;
      --steam-rare-purple: #a34cdd;
      --steam-border: #2a475e;
      --steam-text: #c7d5e0;
      --steam-text-muted: #8f98a0;
      --steam-success-bright: #a4d007;
      --steam-error: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Motiva Sans', Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1b2838 0%, var(--steam-bg-dark) 80%);
      color: var(--steam-text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header.game-header {
      background: linear-gradient(90deg, rgba(23, 26, 33, 0.95) 0%, rgba(27, 40, 56, 0.8) 100%);
      border: 1px solid var(--steam-border);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .game-info h1 { font-size: 1.8rem; color: #ffffff; margin-bottom: 6px; }
    .game-info p { color: var(--steam-text-muted); font-size: 0.9rem; }

    .last-update-tag {
      font-size: 0.75rem;
      color: var(--steam-accent);
      background: rgba(102, 192, 244, 0.1);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--steam-accent);
    }

    .stats-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--steam-bg-card);
      border: 1px solid rgba(42, 71, 94, 0.5);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
    }

    .stat-value { font-size: 1.6rem; font-weight: bold; color: var(--steam-accent); margin-top: 4px; }
    .stat-card.rare .stat-value { color: var(--steam-rare-purple); }

    .controls-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;
      background: var(--steam-bg-card); padding: 12px 18px; border-radius: 6px; border: 1px solid var(--steam-border);
    }

    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-filter {
      background: #212b38; color: var(--steam-text-muted); border: 1px solid transparent; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
    }

    .btn-filter.active { background: var(--steam-accent); color: #000; }

    .search-box {
      display: flex; align-items: center; background: #0d1217; border: 1px solid var(--steam-border); border-radius: 4px; padding: 4px 10px; width: 260px;
    }

    .search-box input { background: transparent; border: none; color: #fff; padding: 6px; font-size: 0.85rem; width: 100%; outline: none; }

    .achievements-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px;
    }

    .achievement-card {
      background: var(--steam-bg-card); border: 1px solid var(--steam-border); border-radius: 6px; padding: 14px; display: flex; gap: 14px; align-items: center; position: relative;
    }

    .achievement-card.locked { opacity: 0.45; filter: grayscale(100%); }

    .rarity-rank-tag {
      position: absolute; top: 8px; right: 10px; font-size: 0.7rem; font-weight: bold; background: rgba(102, 192, 244, 0.15); color: var(--steam-accent); padding: 2px 7px; border-radius: 3px; border: 1px solid var(--steam-accent);
    }

    .game-name-tag {
      font-size: 0.68rem; color: var(--steam-gold); font-weight: bold; text-transform: uppercase; margin-bottom: 2px;
    }

    .achievement-card.rare-achievement { border-color: var(--steam-rare-purple); }
    .achievement-card.rare-achievement .rarity-rank-tag { color: var(--steam-rare-purple); background: rgba(163, 76, 221, 0.15); border-color: var(--steam-rare-purple); }

    .achievement-icon {
      width: 64px; height: 64px; min-width: 64px; border-radius: 4px; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.1); background-color: #0d1217;
    }

    .achievement-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; padding-right: 50px; }
    .achievement-name { font-size: 0.95rem; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .achievement-desc { font-size: 0.78rem; color: var(--steam-text-muted); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .achievement-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.72rem; }
    .unlock-date { color: var(--steam-success-bright); }
    .global-percentage { color: var(--steam-accent); font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="game-header">
      <div class="game-info">
        <h1>Muro Global de Logros de Steam</h1>
        <p>Logros de la biblioteca ordenados del <b style="color:var(--steam-accent);">más raro al menos raro</b>.</p>
      </div>
      <div class="last-update-tag" id="last-update">Cargando fecha de actualización...</div>
    </header>

    <div class="stats-panel">
      <div class="stat-card">
        <div>Logros Totales</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div>Desbloqueados</div>
        <div class="stat-value" style="color: var(--steam-success-bright);" id="stat-unlocked">0</div>
      </div>
      <div class="stat-card rare">
        <div>Raros (&lt;10%)</div>
        <div class="stat-value" id="stat-rare">0</div>
      </div>
      <div class="stat-card">
        <div>Juegos Escaneados</div>
        <div class="stat-value" id="stat-games">0</div>
      </div>
    </div>

    <div class="controls-bar">
      <div class="filter-buttons">
        <button class="btn-filter active" onclick="filterAchievements('all', this)">Todos (Por Rareza)</button>
        <button class="btn-filter" onclick="filterAchievements('unlocked', this)">Desbloqueados</button>
        <button class="btn-filter" onclick="filterAchievements('locked', this)">Bloqueados</button>
        <button class="btn-filter" onclick="filterAchievements('rare', this)">Raros (&lt;10%)</button>
      </div>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Buscar por logro o juego..." oninput="handleSearch()">
      </div>
    </div>

    <div class="achievements-grid" id="achievements-grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--steam-text-muted); padding: 40px;">
        Cargando achievements.json desde el servidor...
      </div>
    </div>

  </div>

  <script>
    function handleImageError(img) {
      img.onerror = null;
      img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23171a21' rx='4'/><path d='M32 14a18 18 0 1 0 18 18A18 18 0 0 0 32 14zm0 30a12 12 0 1 1 12-12 12 12 0 0 1-12 12z' fill='%2366c0f4'/><polygon points='32,22 35,28 42,29 37,34 38,41 32,37 26,41 27,34 22,29 29,28' fill='%23e5c158'/></svg>";
    }

    let masterAchievements = [];
    let activeFilter = 'all';

    async function loadAchievementsJson() {
      const grid = document.getElementById('achievements-grid');
      try {
        const response = await fetch(`./achievements.json?nocache=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        masterAchievements = data.achievements || [];

        document.getElementById('stat-games').textContent = data.scanned_games_count || 0;
        
        if (data.updated_at) {
          const formattedDate = new Date(data.updated_at).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' });
          document.getElementById('last-update').textContent = `Actualizado: ${formattedDate}`;
        }

        applyFiltersAndSearch();
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--steam-error); padding: 40px;">
          ⚠️ No se pudo cargar achievements.json.<br>
          <span style="font-size:0.8rem; color:var(--steam-text-muted);">Ejecuta el workflow de GitHub Actions para generar la base de datos inicial.</span>
        </div>`;
      }
    }

    function renderAchievements(data) {
      const grid = document.getElementById('achievements-grid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--steam-text-muted); padding: 40px;">No se encontraron logros.</div>';
        return;
      }

      data.forEach((ach, index) => {
        const isRare = ach.globalPercent < 10.0;
        const statusClass = ach.unlocked ? 'unlocked' : 'locked';
        const rareClass = isRare ? 'rare-achievement' : '';
        const iconSrc = ach.unlocked ? ach.iconUnlocked : ach.iconLocked;

        const card = document.createElement('div');
        card.className = `achievement-card ${statusClass} ${rareClass}`;

        card.innerHTML = `
          <div class="rarity-rank-tag">#${index + 1} Más Raro</div>
          <img src="${iconSrc}" alt="${ach.name}" class="achievement-icon" onerror="handleImageError(this)">
          <div class="achievement-info">
            <div class="game-name-tag">${ach.gameName}</div>
            <div class="achievement-name" title="${ach.name}">${ach.name}</div>
            <div class="achievement-desc">${ach.description}</div>
            <div class="achievement-meta">
              <span class="unlock-date">${ach.unlocked ? `<i class="fas fa-check-circle"></i> ${ach.unlockTime}` : 'Bloqueado'}</span>
              <span class="global-percentage">${ach.globalPercent}% global</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      const total = masterAchievements.length;
      const unlocked = masterAchievements.filter(a => a.unlocked).length;
      const rare = masterAchievements.filter(a => a.globalPercent < 10.0 && a.unlocked).length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-unlocked').textContent = unlocked;
      document.getElementById('stat-rare').textContent = rare;
    }

    function filterAchievements(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      applyFiltersAndSearch();
    }

    function handleSearch() { applyFiltersAndSearch(); }

    function applyFiltersAndSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = masterAchievements.filter(ach => {
        const matchesFilter = 
          activeFilter === 'all' ||
          (activeFilter === 'unlocked' && ach.unlocked) ||
          (activeFilter === 'locked' && !ach.unlocked) ||
          (activeFilter === 'rare' && ach.globalPercent < 10.0);

        const matchesQuery = 
          ach.name.toLowerCase().includes(query) || 
          ach.description.toLowerCase().includes(query) ||
          ach.gameName.toLowerCase().includes(query);

        return matchesFilter && matchesQuery;
      });

      renderAchievements(filtered);
    }

    document.addEventListener('DOMContentLoaded', loadAchievementsJson);
  </script>
</body>
</html>
